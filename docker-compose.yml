services:
  productapi:
    image: productapi
    build:
      context: .
      dockerfile: ProductAPI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "5044:8080"
    volumes:
      - productapi-data:/app/Database

  webapp:
    image: webapp
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ProductApi__BaseUrl: http://productapi:8080/
    ports:
      - "5168:8080"
    depends_on:
      - productapi

volumes:
  productapi-data:
